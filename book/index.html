<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="reader.css">
</head>
<body>

<!-- ─────────── the closed book ─────────── -->
<div class="shelf" id="shelf">
  <div class="scene">
    <div class="book" id="book" role="button" tabindex="0" aria-label="Open the book">
      <div class="pages-edge"></div>
      <div class="cover">
        <div class="spine-band"></div>
        <div class="foil-rule"></div>
        <p class="kicker" id="coverKicker"></p>
        <svg class="emblem" viewBox="0 0 96 96" aria-hidden="true">
          <line x1="20" y1="20" x2="76" y2="20"/><line x1="20" y1="20" x2="20" y2="76"/>
          <line x1="76" y1="20" x2="76" y2="76"/><line x1="20" y1="76" x2="76" y2="76"/>
          <line x1="20" y1="20" x2="48" y2="48"/><line x1="76" y1="20" x2="48" y2="48"/>
          <line x1="20" y1="76" x2="48" y2="48"/><line x1="76" y1="76" x2="48" y2="48"/>
          <circle cx="20" cy="20" r="3.4"/><circle cx="76" cy="20" r="3.4"/>
          <circle cx="20" cy="76" r="3.4"/><circle cx="76" cy="76" r="3.4"/>
          <circle cx="48" cy="48" r="4.6"/>
        </svg>
        <h1 id="coverTitle"></h1>
        <p class="byline" id="coverByline"></p>
        <div class="foil-rule"></div>
      </div>
    </div>
    <div class="shelf-actions">
      <button class="open-btn" id="openBtn">Open the book</button>
      <button class="resume-btn" id="resumeBtn" hidden></button>
    </div>
  </div>
</div>

<!-- ─────────── the reader ─────────── -->
<div class="app" id="app" hidden>
  <header class="topbar">
    <button class="icon" id="tocToggle" aria-label="Contents" aria-expanded="true">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg>
    </button>
    <button class="brand" id="homeBtn">System&nbsp;Design</button>
    <div class="crumb" id="crumb"></div>
    <div class="grow"></div>
    <button class="icon" id="themeBtn" aria-label="Switch theme">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.2"/><path d="M10 1.6v2M10 16.4v2M1.6 10h2M16.4 10h2M4.1 4.1l1.4 1.4M14.5 14.5l1.4 1.4M15.9 4.1l-1.4 1.4M5.5 14.5l-1.4 1.4"/></svg>
    </button>
    <button class="icon" id="closeBtn" aria-label="Back to the shelf">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 6l8 8M14 6l-8 8"/></svg>
    </button>
  </header>

  <div class="frame">
    <nav class="toc" id="toc" aria-label="Contents"></nav>
    <main class="reading" id="reading" tabindex="-1"></main>
  </div>
</div>

<script src="content.js"></script>
<script src="reader.js"></script>
</body>
</html>
