# The same job, in someone else's C.
#
# Every directive below has a counterpart in lb/balancer.js, lb/policies.js or
# lb/health.js. Tab 8 lines them up side by side. Read this file after you have
# read those three, and the point of the chapter should land: a production load
# balancer is not doing anything conceptually beyond what you already wrote -
# it is doing it in less memory, with more edge cases handled, and with twenty
# years of other people's outages baked into the defaults.
#
# Started only when you ask for it:  npm run nginx:up

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr warn;

  upstream fleet {
    # ---- policy -----------------------------------------------------------
    # Commented out, so the default is round robin. Swap it to compare against
    # the Balancer tab.
    #   least_conn;                    -> lb/policies.js  POLICIES['least-conn']
    #   hash $arg_key consistent;      -> lb/policies.js  consistent-hash + buildRing()
    #
    # `consistent` is not decoration. Without it nginx uses modulo hashing, and
    # Tab 5 measures what that costs when the pool changes: 74% of keys move
    # instead of 26%.

    # ---- the pool ---------------------------------------------------------
    # host.docker.internal is how a container reaches a process on the host.
    # Docker Desktop provides it; the extra_hosts line in docker-compose.yml is
    # what makes the same file work on Linux.
    #
    # This is also the WSL2 hop that makes a throughput comparison against the
    # host-native Node balancer meaningless. Tab 8 measures it rather than
    # pretending it is not there.
    #
    # ---- ejection ---------------------------------------------------------
    # max_fails    -> lb/health.js  ejectAfter
    # fail_timeout -> lb/health.js  probeAfterMs  (and the failure window)
    #
    # One important difference from this lab: these are PASSIVE. Open-source
    # nginx has no active health probe, so it discovers a bad backend by
    # sending it a real request and watching that fail. No probe traffic, but
    # your users pay the detection cost. Active checks are an nginx Plus
    # feature, and that is exactly what you are buying.
    server host.docker.internal:4311 max_fails=3 fail_timeout=5s;
    server host.docker.internal:4312 max_fails=3 fail_timeout=5s;
    server host.docker.internal:4313 max_fails=3 fail_timeout=5s;
    server host.docker.internal:4314 max_fails=3 fail_timeout=5s;

    # `slow_start=10s` would go on a server line -> lb/health.js rampMs + weight().
    # It is another nginx Plus feature, which is worth noticing: the naive
    # version of "add it back to the pool" is free, and the version that does
    # not immediately re-break the instance you just recovered is not.

    # ---- connection reuse -------------------------------------------------
    # -> lb/balancer.js  new http.Agent({ keepAlive: true, maxSockets: 64 })
    #
    # The finite number matters in both places. An unbounded pool means there is
    # never a queue, and "least connections" has nothing to count.
    keepalive 64;
  }

  server {
    listen 4320;

    # A trivial endpoint of nginx's own, so Tab 8 can measure the container hop
    # without involving the fleet at all.
    location = /nginx-health {
      return 200 '{"ok":true,"who":"nginx"}';
      add_header Content-Type application/json;
    }

    location / {
      proxy_pass http://fleet;

      # -> lb/balancer.js  the retry branch in proxy()
      #
      # Safe here only because /work is idempotent. Retrying a POST that already
      # charged a card is a different lesson, and a worse afternoon.
      proxy_next_upstream error timeout http_500 http_502 http_503;
      proxy_next_upstream_tries 2;

      # -> lb/balancer.js  upstream.setTimeout(5000)
      #
      # This is what catches a `hung` backend: one that accepts the connection
      # and then never answers. Without a read timeout, one broken instance
      # consumes the balancer's own capacity and a single failure becomes a
      # total outage.
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;

      # Keep-alive to upstreams needs both of these. Forget them and every
      # proxied request opens a new connection, which on Windows exhausts the
      # ephemeral port range in about two minutes.
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Lab-Balancer "nginx" always;
    }
  }
}
